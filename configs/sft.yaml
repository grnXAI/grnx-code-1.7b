model:
  name: Qwen/Qwen2.5-1.5B
  tokenizer: Qwen/Qwen2.5-1.5B
  dtype: bfloat16
  gradient_checkpointing: true

data:
  processed_dir: ./processed/SFT
  shard_pattern: "*.pt"
  sequence_length: 2048
  shuffle: true
  num_workers: 4

training:
  output_dir: ./checkpoints/SFT
  epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  weight_decay: 0.1
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  bf16: true
  tf32: true
  logging_steps: 10
  save_steps: 500
  save_total_limit: 3
  max_grad_norm: 1.0
  seed: 42