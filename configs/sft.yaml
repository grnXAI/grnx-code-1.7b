model:
  name: Qwen/Qwen2.5-1.5B
  tokenizer: tokenizer/qwen
  dtype: bfloat16
  gradient_checkpointing: true

data:
  raw_dir: data/raw/sft/opencode-reasoning-50k
  processed_dir: data/processed/sft/opencode-reasoning-50k
  sequence_length: 2048
  shard_pattern: "shard_*.pt"
  shuffle: true
  num_workers: 4

training:
  output_dir: checkpoints/sft/opencode-reasoning-50k
  epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  weight_decay: 0.1
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  bf16: true
  tf32: true
  logging_steps: 10
  save_steps: 500
  save_total_limit: 3
  max_grad_norm: 1.0
  seed: 42